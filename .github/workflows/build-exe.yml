name: Build Windows executable

on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      # The .exe is created in the "install" phase (launch4j).
      # Tests are skipped: the UI tests open windows and need a display.
      - name: Build
        run: mvn -B clean install -DskipTests -DskipITs

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          EXE=$(find . -name "Thumbnail Generator.exe" -not -path "./dist/*" | head -n 1)
          if [ -z "$EXE" ]; then
            echo "Thumbnail Generator.exe was not produced. Files found:"
            find . -name "*.exe" -o -name "*.jar" | grep -v node_modules | head -50
            exit 1
          fi
          echo "Found $EXE"
          cp "$EXE" dist/
          cp -r assets dist/assets
          cp -r settings dist/settings
          cp README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ThumbnailGenerator-windows
          path: dist/
          if-no-files-found: error

      # Plain jar as a fallback: run with  java -jar <file>.jar
      - uses: actions/upload-artifact@v4
        with:
          name: ThumbnailGenerator-jar
          path: target/*.jar
          if-no-files-found: warn
